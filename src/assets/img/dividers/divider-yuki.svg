<svg xmlns="http://www.w3.org/2000/svg" width="200" height="64" viewBox="0 0 200 64">
  <defs>
    <style>
      .bg { fill: #d1343c; opacity: 0.12; }
      .apple { fill: #d1343c; opacity: 0.7; }
      .shine { fill: white; opacity: 0.15; }
      .stem { stroke: #5a3a0a; stroke-width: 1.5; fill: none; opacity: 0.5; }
      .leaf { fill: #228B22; opacity: 0.3; }
    </style>
  </defs>
  <rect class="bg" width="200" height="64"/>
  <g class="apple">
    <ellipse cx="40" cy="34" rx="12" ry="13"/>
    <path class="shine" d="M 34 28 Q 38 26 42 28" stroke="white" stroke-width="1.5" fill="none" opacity="0.3"/>
    <line x1="40" y1="21" x2="40" y2="15" class="stem"/>
    <ellipse class="leaf" cx="44" cy="16" rx="6" ry="3" transform="rotate(20 44 16)"/>
  </g>
  <g class="apple" transform="translate(100,0)" opacity="0.6">
    <ellipse cx="40" cy="34" rx="12" ry="13"/>
    <line x1="40" y1="21" x2="40" y2="15" class="stem"/>
    <ellipse class="leaf" cx="44" cy="16" rx="6" ry="3" transform="rotate(20 44 16)"/>
  </g>
  <g class="apple" transform="translate(-60,0)" opacity="0.5">
    <ellipse cx="40" cy="34" rx="12" ry="13"/>
    <line x1="40" y1="21" x2="40" y2="15" class="stem"/>
  </g>
  <g class="apple" transform="translate(160,0)" opacity="0.4">
    <ellipse cx="40" cy="34" rx="12" ry="13"/>
    <line x1="40" y1="21" x2="40" y2="15" class="stem"/>
  </g>
  <line x1="0" y1="10" x2="200" y2="10" stroke="#d1343c" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="54" x2="200" y2="54" stroke="#d1343c" stroke-width="0.5" opacity="0.3"/>
</svg>
