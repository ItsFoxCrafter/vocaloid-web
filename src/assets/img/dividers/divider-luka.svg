  </g>
  <line x1="0" y1="8" x2="200" y2="8" stroke="#ff7eb9" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="56" x2="200" y2="56" stroke="#ff7eb9" stroke-width="0.5" opacity="0.3"/>
