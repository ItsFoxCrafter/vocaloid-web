<svg xmlns="http://www.w3.org/2000/svg" width="200" height="64" viewBox="0 0 200 64">
  <defs>
    <style>
      .bg { fill: #ff7eb9; opacity: 0.15; }
      .fish { fill: #ff7eb9; opacity: 0.7; }
      .fin { fill: #ff7eb9; opacity: 0.5; }
    </style>
  </defs>
  <rect class="bg" width="200" height="64"/>
  <g class="fish">
    <ellipse cx="40" cy="32" rx="22" ry="10"/>
    <polygon points="62,32 72,22 72,42"/>
    <circle cx="30" cy="30" r="2.5" fill="#121212" opacity="0.3"/>
  </g>
  <g class="fish" transform="translate(100,0)">
    <ellipse cx="40" cy="32" rx="22" ry="10"/>
